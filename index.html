<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GIGOS — Zehlendorf Mitte</title>
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
<div id="wrap"><canvas id="game" width="320" height="180"></canvas></div>

<div id="banner"><div class="b-sub" id="bSub">Bezirk</div><div class="b-name" id="bName">Zehlendorf Mitte</div></div>
<div id="dialog"><div class="who" id="dWho"></div><div id="dText"></div><div id="dChoices"></div><div class="more">▼</div></div>
<div id="toast"></div>

<div id="title">
  <div style="position:relative;display:flex;align-items:center;justify-content:center">
    <img id="loadImg" alt="Zehlendorf Mitte">
    <div id="titleText">
      <div id="startpill">Enter zum Start</div>
    </div>
  </div>
</div>

<div id="invBack"></div>
<div id="inv">
  <div class="inv-head">🎒 Inventar <span id="invClose">✕</span></div>
  <div id="invGrid"></div>
  <div class="inv-foot">I / ✕&nbsp;·&nbsp;Schließen</div>
</div>

<div id="touch">
  <div class="pad" id="pUp">▲</div><div class="pad" id="pDown">▼</div>
  <div class="pad" id="pLeft">◀</div><div class="pad" id="pRight">▶</div>
  <div class="pad" id="pInv">🎒</div>
  <div class="pad" id="pDex">📔</div>
  <div class="pad" id="pTeam">🐾</div>
  <div class="pad" id="pA">A</div>
</div>
<div class="hint">Bewegen: WASD / Pfeile &nbsp;·&nbsp; Reden: E &nbsp;·&nbsp; Inventar: I &nbsp;·&nbsp; Team: T &nbsp;·&nbsp; Berlinodex: B</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
